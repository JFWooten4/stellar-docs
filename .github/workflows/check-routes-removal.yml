name: Check Routes Removal

on:
  pull_request_target:
    paths:
      - 'routes.txt'

permissions:
  contents: read
  issues: write

jobs:
  check-routes-removal:
    runs-on: ubuntu-latest
    steps:
      - name: Check for removed routes and comment
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pullRequest = context.payload.pull_request;

            const decodeContent = (file) =>
              Buffer.from(file.content, file.encoding).toString('utf8');

            const { data: baseFile } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'routes.txt',
              ref: pullRequest.base.sha,
            });

            let headContent = '';
            try {
              const { data: headFile } = await github.rest.repos.getContent({
                owner: pullRequest.head.repo.owner.login,
                repo: pullRequest.head.repo.name,
                path: 'routes.txt',
                ref: pullRequest.head.sha,
              });
              headContent = decodeContent(headFile);
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const baseRoutes = decodeContent(baseFile)
              .split(/\r?\n/)
              .filter(Boolean);
            const headRoutes = new Set(
              headContent.split(/\r?\n/).filter(Boolean),
            );
            const removedRoutes = baseRoutes.filter((route) => !headRoutes.has(route));

            if (removedRoutes.length === 0) {
              core.info('No routes were removed.');
              return;
            }

            const formattedDiff = removedRoutes
              .map((route) => `-${route}`)
              .join('\n');

            const comment = `> [!WARNING]  
            > This change removes routes. The removed routes are below. Please verify that these changes are intentional and that redirects are in place if needed. Redirects can be added to \`nginx/includes/redirects.conf\`.

            \`\`\`diff
            ${formattedDiff}
            \`\`\`
            `;

            await github.rest.issues.createComment({
              issue_number: pullRequest.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment,
            });
