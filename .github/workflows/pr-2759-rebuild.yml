name: Rebuild PR 2759

on:
  push:
    branches:
      - automation/pr-2759-rebuild

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7.0.1
        with:
          repository: JFWooten4/stellar-docs
          ref: 2731-flatten-single-page-readmes
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify expected bot rebuild
        run: |
          test "$(git rev-parse HEAD)" = "5cc40ba986bd58e2ae951a85abb9b00685fd6698"
          echo "BASE=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"

      - name: Restore transient Stellar CLI outputs
        run: |
          git restore --source="$BASE" --staged --worktree -- docs/tools/cli src/helpers/stellarCli.ts

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --prefer-offline --frozen-lockfile

      - name: Copy files from Stellar CLI
        run: pnpm stellar-cli:build -- --cli-ref='main'

      - name: Fix CLI links
        run: pnpm stellar-cli:fix-links

      - name: Check MDX formatting
        run: git update-index -g && pnpm ci:mdx

      - name: Check new absolute internal links
        run: |
          git remote add upstream https://github.com/stellar/stellar-docs.git || true
          git fetch upstream main --depth=1
          scripts/check-relative-links.sh --range 'upstream/main...HEAD' \
            || { echo '::error::New absolute /docs link(s) found above.'; exit 1; }

      - name: Build docs
        run: pnpm build

      - name: Remove transient build inputs from final commit
        run: |
          git restore --source="$BASE" --staged --worktree -- docs/tools/cli src/helpers/stellarCli.ts
          pnpm ci:mdx
          git add -u
          echo 'Final tracked delta before rewrite:'
          git status --short

      - name: Replace rebuild with clean bot commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --soft "$BASE"
          git commit -m '🔗 Update flattened page references'
          git push --force-with-lease origin HEAD:2731-flatten-single-page-readmes
