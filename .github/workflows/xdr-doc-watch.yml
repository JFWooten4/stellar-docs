name: XDR documentation watch

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: xdr-documentation-watch
  cancel-in-progress: false

jobs:
  check-xdr-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Compare the XDR baseline with curr
        id: xdr-watch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-xdr-doc-links.mjs --output xdr-watch-report.md

      - name: Open or update the XDR review issue
        if:
          steps.xdr-watch.outputs.changed == 'true' && github.ref_name ==
          github.event.repository.default_branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_PATH: xdr-watch-report.md
        with:
          script: |
            const fs = require('node:fs');
            const title = '[XDR watch] Review changes to curr';
            const body = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            const result = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${title}"`,
              per_page: 100,
            });
            const issue = result.data.items.find(candidate => candidate.title === title);

            if (issue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                title,
                body,
                state: 'open',
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Close the XDR review issue when the baseline is current
        if:
          steps.xdr-watch.outputs.changed == 'false' && github.ref_name ==
          github.event.repository.default_branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = '[XDR watch] Review changes to curr';
            const result = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
              per_page: 100,
            });
            const issue = result.data.items.find(candidate => candidate.title === title);

            if (issue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'The recorded XDR baseline now matches `curr`; closing this tracking issue.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
