name: Normalize meeting authors

on:
  push:
    branches:
      - meetings-collective
    paths:
      - .github/workflows/normalize-meeting-authors.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: meetings-collective
          fetch-depth: 0

      - name: Normalize meeting author frontmatter
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main

          python3 <<'PY'
          import pathlib
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True)

          def author_span(lines):
              if not lines or lines[0].strip() != "---":
                  return None
              try:
                  end = next(i for i in range(1, len(lines)) if lines[i].strip() == "---")
              except StopIteration:
                  return None

              for i in range(1, end):
                  if re.match(r"^authors\s*:", lines[i]):
                      j = i + 1
                      if lines[i].split(":", 1)[1].strip():
                          return i, j
                      while j < end:
                          line = lines[j]
                          if re.match(r"^[A-Za-z0-9_-]+\s*:", line):
                              break
                          j += 1
                      return i, j
              return None

          def replace_author_block(text, replacement):
              lines = text.splitlines(keepends=True)
              span = author_span(lines)
              if span:
                  start, end = span
                  lines[start:end] = replacement
              else:
                  try:
                      fm_end = next(i for i in range(1, len(lines)) if lines[i].strip() == "---")
                  except StopIteration:
                      raise ValueError("Missing frontmatter terminator")
                  insert_at = next((i for i in range(1, fm_end) if re.match(r"^tags\s*:", lines[i])), fm_end)
                  lines[insert_at:insert_at] = replacement
              return "".join(lines)

          changed = git("diff", "--name-status", "origin/main...HEAD", "--", "meetings").splitlines()
          for row in changed:
              parts = row.split("\t")
              status = parts[0][0]
              path = parts[-1]
              if not path.endswith(".mdx"):
                  continue

              p = pathlib.Path(path)
              current = p.read_text()

              if status == "A":
                  updated = replace_author_block(current, ["authors: john\n"])
              else:
                  try:
                      main = git("show", f"origin/main:{path}")
                  except subprocess.CalledProcessError:
                      continue
                  main_lines = main.splitlines(keepends=True)
                  span = author_span(main_lines)
                  replacement = main_lines[span[0]:span[1]] if span else []

                  current_lines = current.splitlines(keepends=True)
                  current_span = author_span(current_lines)
                  if replacement:
                      updated = replace_author_block(current, replacement)
                  elif current_span:
                      start, end = current_span
                      current_lines[start:end] = []
                      updated = "".join(current_lines)
                  else:
                      updated = current

              if updated != current:
                  p.write_text(updated)
          PY

          rm .github/workflows/normalize-meeting-authors.yml

          git config user.name "Codex Web"
          git config user.email "noreply@openai.com"
          git add -A

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Normalize meeting authors" -m "Set authors to john only for meeting files added relative to main, while restoring existing meeting-file author frontmatter to match main exactly.

Co-authored-by: Codex Web <noreply@openai.com>"
          git push origin HEAD:meetings-collective
