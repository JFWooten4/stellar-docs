on:
  pull_request:
    paths:
      - 'routes.txt'

permissions:
  contents: read
  issues: write

jobs:
  check-routes-removal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for route changes
        id: check-routes
        run: |
          # Get the added and removed lines in routes.txt
          ROUTES_DIFF=$(git diff origin/${{ github.base_ref }} ${{ github.sha }} -- routes.txt)

          # Count changed lines, excluding diff metadata
          ADDED_COUNT=$(printf '%s\n' "$ROUTES_DIFF" | { grep -E '^\+[^+]' || true; } | wc -l)
          REMOVED_COUNT=$(printf '%s\n' "$ROUTES_DIFF" | { grep -E '^\-[^-]' || true; } | wc -l)

          echo "added_count=$ADDED_COUNT" >> "$GITHUB_OUTPUT"
          echo "removed_count=$REMOVED_COUNT" >> "$GITHUB_OUTPUT"

          if [ "$ADDED_COUNT" -gt 0 ] || [ "$REMOVED_COUNT" -gt 0 ]; then
            echo "routes_changed=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$ROUTES_DIFF" > routes.diff
          else
            echo "routes_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add route diff to summary
        if: steps.check-routes.outputs.routes_changed == 'true'
        run: |
          {
            echo "## Route changes"
            echo "- Added: ${{ steps.check-routes.outputs.added_count }}"
            echo "- Removed: ${{ steps.check-routes.outputs.removed_count }}"
            echo
            echo '```diff'
            cat routes.diff
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR (if routes changed)
        if: |
          steps.check-routes.outputs.routes_changed == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs')
            const diffContent = fs.readFileSync('routes.diff', 'utf8');
            const addedCount = Number('${{ steps.check-routes.outputs.added_count }}');
            const removedCount = Number('${{ steps.check-routes.outputs.removed_count }}');

            // Convert escaped newlines back for display
            const formattedDiff = diffContent.replace(/%0A/g, '\n').replace(/%0D/g, '\r').replace(/%25/g, '%');

            const removalWarning = removedCount > 0
              ? '> [!WARNING]\n> Verify that removed routes are intentional and have redirects where needed. Redirects can be added to `nginx/includes/redirects.conf`.'
              : 'This change adds routes without removing any existing routes.';

            const comment = `## Route changes

            - Added: ${addedCount}
            - Removed: ${removedCount}

            ${removalWarning}

            \`\`\`diff
            ${formattedDiff}
            \`\`\`

            `;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
