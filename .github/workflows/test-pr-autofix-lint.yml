name: Validate PR autofix workflows

on:
  push:
    branches:
      - automation/pr-2759-rebuild
    paths:
      - .github/workflows/test-pr-autofix-lint.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v7.0.1
        with:
          ref: automation/pr-autofix
          fetch-depth: 0

      - name: Parse workflow YAML
        id: yaml
        run: |
          set +e
          ruby -ryaml -e '
            ARGV.each do |file|
              data = YAML.load_file(file)
              raise "missing jobs in #{file}" unless data.is_a?(Hash) && data["jobs"].is_a?(Hash)
              puts "parsed #{file}"
            end
          ' .github/workflows/pr-autofix.yml .github/workflows/pr-autofix-apply.yml
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Report result on helper branch
        env:
          YAML_STATUS: ${{ steps.yaml.outputs.status }}
        run: |
          set -euo pipefail
          git fetch origin automation/pr-2759-rebuild
          git switch -C validation-result origin/automation/pr-2759-rebuild
          printf 'yaml_status=%s\n' "$YAML_STATUS" > automation-validation-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation-validation-result.txt
          git commit -m 'Report autofix workflow validation' || exit 0
          git push origin HEAD:automation/pr-2759-rebuild
