name: Prettier once

on:
  push:
    branches:
      - tmp/pr2730-prettier

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: tmp/pr2730-prettier
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'
      - run: corepack enable
      - run: pnpm install --prefer-offline --frozen-lockfile
      - run: pnpm format:mdx
      - name: Commit formatted output and remove this workflow
        run: |
          rm .github/workflows/prettier-once.yml
          git config user.name "Codex Web"
          git config user.email "noreply@openai.com"
          git add docs src/pages meetings .github/workflows/prettier-once.yml
          git commit -m "🖌️ Format MDX with Prettier" -m "Co-authored-by: Codex Web <noreply@openai.com>"
          git push origin HEAD:tmp/pr2730-prettier
