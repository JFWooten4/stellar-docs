name: Build, format MDX and Lint

on:
  push:
    branches:
      - meetings-collective
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-transcripts:
    if: github.event_name == 'push' && github.ref == 'refs/heads/meetings-collective'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Remove transcript blocks and restore workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(
              r'\n?<details>\s*\n\s*<summary>Video Transcript</summary>\s*\n.*?</details>\s*\n?',
              re.DOTALL,
          )

          removed = 0
          for path in sorted(Path('meetings').glob('*.mdx')):
              text = path.read_text()
              updated, count = pattern.subn('\n', text)
              if count:
                  path.write_text(updated)
                  removed += count
                  print(f'{path}: removed {count} transcript block(s)')

          print(f'Removed {removed} transcript block(s) total')
          PY
          git checkout HEAD^ -- .github/workflows/main.yml

      - name: Commit transcript-only cleanup
        shell: bash
        run: |
          git config user.name "John Wooten"
          git config user.email "60260750+JFWooten4@users.noreply.github.com"
          git add meetings .github/workflows/main.yml
          if git diff --cached --quiet; then
            echo "No transcript blocks remain."
            exit 0
          fi
          git commit -m "Remove remaining meeting transcripts" -m "Co-authored-by: Codex Web <noreply@openai.com>"
          git push origin HEAD:meetings-collective

  complete:
    if: always() && github.event_name != 'push'
    needs: [ mdx-format, build ]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  mdx-format:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout App Repo
        uses: actions/checkout@v7.0.1
        with:
          # Full history so we can diff the PR against its base branch and only
          # flag links introduced by this PR, not pre-existing repo content.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Enable Corepack
        run: corepack enable

      - name: Install App Dependencies
        run: pnpm install --prefer-offline --frozen-lockfile

      - name: Check MDX
        run:  git update-index -g && pnpm ci:mdx

      - name: Show Diff if Prettier Fails
        if: ${{ failure() }}
        run: pnpm diff:mdx && echo "::error::Prettier static analysis failed"

      - name: No new absolute internal /docs links
        # Canonical rule lives in scripts/check-relative-links.sh (shared with
        # the pre-commit hook). Only flags absolute /docs links introduced by
        # this PR's diff, not pre-existing content in untouched lines.
        run: |
          base="${{ github.base_ref }}"
          scripts/check-relative-links.sh --range "origin/${base:-main}...HEAD" \
            || { echo "::error::New absolute /docs link(s) found above."; exit 1; }

  build:
    if: github.event_name != 'push'
    uses: ./.github/workflows/build.yml
